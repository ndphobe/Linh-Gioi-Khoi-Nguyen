services:
  - type: web
    name: linh-gioi-khoi-nguyen-server
    runtime: node
    plan: free
    # NODE_ENV is production for the running server, but Vite is intentionally
    # a devDependency. Include build tooling explicitly during the build phase.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false
